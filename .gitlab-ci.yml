default:
  interruptible: true
  tags:
    - bigaction

stages:
  - build

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

Build Development:
  image: docker:19.03.12
  stage: build
  services:
    - docker:19.03.12-dind
  script:
    - sudo rsync -av ./scripts/ /data/nifi-scripts/
    - if [ ! -f /data/nifi-scripts/requirements.txt ] || ! cmp -s requirements.txt /data/nifi-scripts/requirements.txt; then \
        sudo rsync -av requirements.txt /data/nifi-scripts/requirements.txt \
        echo "Installing requirements..." \
        alias kubectl='kubectl --insecure-skip-tls-verify=true' \
        kubectl -n bigbox exec statefulset/bigaction-core  -- /opt/nifi/nifi-current/venv/bin/pip install -r /opt/nifi/nifi-current/scripts/requirements.txt \
      fi
    - sudo chown -R 1000:1000 /data/nifi-scripts/