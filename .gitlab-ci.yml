default:
  interruptible: true
  tags:
    - bigaction

stages:
  - build

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1
  KUBE_NAMESPACE: "bigbox"

Build Development:
  image: docker:19.03.12
  stage: build
  services:
    - docker:19.03.12-dind
  script:
    # TODO: We need to rsync then scp to all nodes, but for now we just do it on one node (bigaction-core-0)
    - sudo rsync -av ./scripts/ /data/nifi-scripts/
    # SCP the /data/nifi-scripts and /data/nifi-venv to 192.168.15.24 an .25 as admin user
    - |
      rsync -av /data/nifi-scripts/ admin@192.168.15.24:/data/
      rsync -av /data/nifi-scripts/ admin@192.168.15.25:/data/
      rsync -av /data/nifi-venv/ admin@192.168.15.24:/data/
      rsync -av /data/nifi-venv/ admin@192.168.15.25:/data/

    - |
      kubectl config set-cluster k8s-cluster --server=$KUBE_URL --insecure-skip-tls-verify=true
      kubectl config set-credentials gitlab-user --token=$KUBE_TOKEN
      kubectl config set-context bigaction-cicd --cluster=k8s-cluster --user=gitlab-user --namespace=$KUBE_NAMESPACE
      kubectl config use-context bigaction-cicd

      if [ ! -f /data/nifi-scripts/requirements.txt ] || ! cmp -s requirements.txt /data/nifi-scripts/requirements.txt; then
        echo "Changes detected or file missing. Updating requirements..."
        sudo rsync -av requirements.txt /data/nifi-scripts/requirements.txt

        # Re-Install on all nodes (Please add more nodes if you have more than 3)      
        for i in {0..0}; do
          echo "Installing on pod bigaction-core-$i..."
          kubectl -n bigbox exec bigaction-core-$i -- /opt/nifi/nifi-current/venv/bin/pip install -r /opt/nifi/nifi-current/scripts/requirements.txt
        done
      else
        echo "requirements.txt is up to date. Skipping install."
      fi
    - sudo chown -R 1000:1000 /data/nifi-scripts/